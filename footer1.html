<!doctype html>
<html lang="en">
  <head>
<style>
    #social-media{
        background: #2f3550;
    }

    .m-headiing{
        font-weight:700;
        margin-top:6px;
    }

    .media_link{
        border: 2px solid #f2a900;
        border-radius:4px;
        padding:14px 18px;
        margin-right:18px;
        background:transparent;
        text-align: left;
    }

    .row.pt-5{
        gap:18px;
    }
    .media_link h3{
        font-size:16px;
        font-weight:600;

    }
    .media_link i{
        font-size:22px;
    }

    .media_link.bg-warning{
        border:2px solid #f2a900;
    }
</style>






    <script src="https://kit.fontawesome.com/8432b15000.js" crossorigin="anonymous"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
  </head>
  <body>
<div id="social-media" class="container-fluid">
    <div class="container text-white py-5">
        <h4 class="text-warning">Social Media</h4>
        <h1 class="m-heading">Lets be friends</h1>
        <div class="row pt-5">
            <div class="col-3 media_link btn" href="#">
                <div class="row">
                    <div class="col-6 d-flex justify-content-start">
                        <h3 class="m-0 pt-2 text-white">Linkedin</h3>
                    </div>
                    <div class="col-6 d-flex justify-content-end align-items-center">
                        <i class="fab fa-linkedin-in fa-2x text-secondary"></i>
                    </div>
                </div>
            </div>
            <div class="col-3 media_link btn">
                <div class="row">
                    <div class="col-6 d-flex justify-content-start">
                        <h3 class="m-0 pt-2 text-white">Youtube</h3>
                    </div>
                    <div class="col-6 d-flex justify-content-end align-items-center">
                        <i class="fab fa-youtube fa-2x text-secondary"></i>
                    </div>
                </div>
            </div>
            <div class="col-3 media_link bg-warning btn">
                <div class="row">
                    <div class="col-6 d-flex justify-content-start">
                        <h3 class="m-0 pt-2 text-dark">Email</h3>
                    </div>
                    <div class="col-6 d-flex justify-content-end align-items-center">
                        <i class="fas fa-envolope fa-2x text-secondary"></i>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>









    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
